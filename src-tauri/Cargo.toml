[package]
name = "kindred"
version = "1.3.0"
edition = "2021"
description = "Kindred: chat with local AI characters"
authors = ["Kisahime"]
license = "MIT"
repository = "https://github.com/Kisahime/kindred"

[lib]
name = "kindred_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"

[dev-dependencies]
tempfile = "3"
